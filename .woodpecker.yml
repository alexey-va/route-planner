labels:
  deploy-host: vds-general

when:
  - event: [push, manual]
    branch: master

steps:
  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/route-planner-vds/ci/deploy-route-planner-web.sh:/opt/ci/deploy-route-planner-web.sh:ro
    commands:
      - apk add --no-cache bash git
      - bash /opt/ci/deploy-route-planner-web.sh
